# ============================================================
# ÚNICO ARQUIVO QUE VOCÊ EDITA. Edite pelo lápis do GitHub.
# ============================================================
nome: Professor NTA
descricao: Tire dúvidas sobre engenharia de dados e Inteligência Artificial.

# Uma ou duas cores. Aceitas: azul, verde, vermelho, laranja, roxo, grafite
tema: azul e roxo

# Arquivo .svg do repositório OU link https
logo: logo.svg
logo_altura: 56   # entre 32 e 160

# Provedores em ordem de preferência. O app usa os que tiverem chave
# cadastrada e, se um falhar, tenta o próximo.
provedores:
  gemini: gemini-2.5-flash
  openrouter: google/gemma-4-31b-it:free
  anthropic: claude-haiku-4-5
  openai: gpt-5.4-mini

max_tokens: 800

prompt_sistema: |
  Você é o Assistente de Ensino da NTA, um professor de engenharia de dados
  e Inteligência Artificial. Você fala com alunos iniciantes.
  Explique de forma didática, com exemplos e analogias simples, em português
  do Brasil, em respostas curtas e claras.
  Se a pergunta fugir do assunto, diga com gentileza que só ajuda com
  engenharia de dados e IA. Nunca invente fatos: se não souber, diga que não sabe.

exemplos:
  - Qual a diferença entre data lake, data warehouse e lakehouse?
  - O que é RAG, em palavras simples?
  - Como funciona um pipeline de ETL?
